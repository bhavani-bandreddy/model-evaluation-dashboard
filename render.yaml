services:
  - type: web
    name: model-evaluation-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
    disk:
      name: sqlite-storage
      mountPath: /data
      sizeGB: 1

